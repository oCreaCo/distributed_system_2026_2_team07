    \ Use the network matrices for structure-aware construction\n(clustering GPUs\
    \ by region, matching stages, ordering pipelines) and spend the cost_fn budget\n\
    wisely. Never call cost_fn more than `budget` times, finish within 30 s per topology,\
    \ and\nuse only the Python standard library."
