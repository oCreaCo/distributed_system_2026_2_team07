    \ number of cost_fn calls.\n\nWhat the simulator (cost_fn) captures, measured\
    \ on real A100 GPUs\n- Effective bandwidth is limited by the TCP window: min(bw,\
    \ ~10 MB / round-trip time), so\n  high-latency links are much slower than their\
    \ nominal bandwidth.\n- Pipeline activation transfers overlap almost fully with\
    \ compute unless a link is very slow;\n  the slowest link adjacent to a stage\
    \ bounds every micro-batch.\n- Data-parallel gradient sync overlaps only partly\
    \ with the CPU optimizer, so putting a\n  data-parallel group across a slow link\
    \ is usually costly.\n\nGoal: minimize cost_fn of the returned rank_map, averaged\
