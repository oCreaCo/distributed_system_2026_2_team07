    \ GPUs. Return rank_map, a permutation of 0..N-1: rank_map[gpu] = rank,\n  stage\
    \ = rank % pp, data-parallel replica = rank // pp.\n- GPUs with the same stage\
    \ form a data-parallel group: they exchange the full gradients of\n  that stage\
    \ (hundreds of MB) every iteration, through replica 0 of the stage.\n- GPUs with\
    \ the same replica form a pipeline: each micro-batch sends an 8 MB activation\
    \ from\n  stage s to stage s+1 (and gradients back), 128 micro-batches per iteration.\n\
    - Inputs: delay_ms[i][j], bandwidth_gbps[i][j] (asymmetric matrices are possible),\
